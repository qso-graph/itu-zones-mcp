[project]
name = "itu-zones-mcp"
version = "0.3.0"
description = "ITU zones as the IARU publishes them for amateur use, in ADIF's DXCC and subdivision codes"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
]
keywords = [
    "amateur-radio", "ham-radio", "qso-graph", "mcp", "model-context-protocol", "adif",
    "itu-zones", "iaru", "zones", "iaru-hf-championship",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/itu-zones/"
Repository = "https://github.com/qso-graph/itu-zones-mcp"
Issues = "https://github.com/qso-graph/itu-zones-mcp/issues"

[project.scripts]
itu-zones-mcp = "itu_zones_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4", "adif-mcp>=1.2", "pypdf>=5", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itu_zones_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site", "scripts"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is adopted (#15, qso-graph-devel#70). It reported 37 lines and not one of
# them was a defect — the finding, not an argument against enforcing it.
#
# The deferral note here predicted that some lines would not be reflowed at all,
# because they name ADIF's field `Primary_Administrative_Subdivision` exactly and
# the owner of a list is its authority. Four lines name it, and all four reflow
# with the field name whole, by binding the subscript chain to a name first.
# No line in this repo is exempt and there is no `# noqa: E501`.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
